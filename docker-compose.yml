version: "3.9"

services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      - PORT=3000
      - API_VERSION=${API_VERSION:-v1}

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      - API_BASE_URL=http://backend:3000
    depends_on:
      - backend

